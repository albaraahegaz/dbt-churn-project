version: 2

models:
  - name: stg_customer_churn
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['Stayed', 'Churned', 'Joined']
      - name: zip_code
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_zipcode_population')
                field: zip_code

  - name: stg_zipcode_population
    columns:
      - name: zip_code
        data_tests: [unique, not_null]